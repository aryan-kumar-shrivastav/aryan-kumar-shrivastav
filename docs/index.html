<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>~/progress | DSA &amp; Cybersecurity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] },
      colors: { term: '#00ff9c', bg: '#0a0e0f', panel: '#10171a', edge: '#1c2a2e' } } } };
  </script>
</head>
<body class="bg-bg text-gray-300 font-mono min-h-screen">
<main class="max-w-5xl mx-auto px-4 py-12">

  <header class="mb-10">
    <p class="text-term text-sm">$ whoami</p>
    <h1 class="text-3xl font-semibold text-white mt-1">YOUR NAME<span class="animate-pulse text-term">_</span></h1>
    <p class="text-gray-400 mt-2">DSA &middot; Cybersecurity &middot; Learning in public</p>
    <p class="mt-3 text-sm"><a class="text-term hover:underline" href="https://github.com/YOUR_GITHUB_USERNAME">github</a></p>
  </header>

  <section class="grid gap-6 md:grid-cols-3">
    <div class="bg-panel border border-edge rounded-lg p-5">
      <h2 class="text-term text-sm mb-4">&gt; leetcode</h2>
      <div id="lc" class="text-sm text-gray-400">loading...</div>
    </div>
    <div class="bg-panel border border-edge rounded-lg p-5">
      <h2 class="text-term text-sm mb-4">&gt; tryhackme</h2>
      <iframe src="https://tryhackme.com/api/v2/badges/public-profile?userPublicId=YOUR_THM_PUBLIC_ID"
              style="border:none;width:100%;height:200px;" title="TryHackMe badge" loading="lazy"></iframe>
    </div>
    <div class="bg-panel border border-edge rounded-lg p-5">
      <h2 class="text-term text-sm mb-4">&gt; hackthebox</h2>
      <div id="htb" class="text-sm text-gray-400">loading...</div>
    </div>
  </section>

  <section class="mt-6 grid gap-6 md:grid-cols-3">
    <div class="bg-panel border border-edge rounded-lg p-5 md:col-span-2">
      <h2 class="text-term text-sm mb-4">&gt; striver_a2z <span id="a2z-sum" class="text-gray-500"></span></h2>
      <div id="topics" class="grid gap-x-8 gap-y-3 sm:grid-cols-2 text-xs">loading...</div>
    </div>
    <div class="bg-panel border border-edge rounded-lg p-5">
      <h2 class="text-term text-sm mb-4">&gt; leetcode_over_time</h2>
      <div id="spark"></div>
    </div>
  </section>

  <footer class="mt-10 text-xs text-gray-600">last sync: <span id="synced">--</span></footer>
</main>

<script>
  const $ = id => document.getElementById(id);
  const row = (k, v) => `<div class="flex justify-between py-1 border-b border-edge/60"><span>${k}</span><span class="text-white">${v ?? '—'}</span></div>`;
  const load = p => fetch(p, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(p); return r.json(); });

  function spark(vals) {
    if (vals.length < 2) return '<p class="text-xs text-gray-600">history builds up as stats change</p>';
    const w = 300, h = 80, max = Math.max(...vals), min = Math.min(...vals), span = (max - min) || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / span) * (h - 8) - 4}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full"><polyline fill="none" stroke="#00ff9c" stroke-width="2" points="${pts}"/></svg>
            <div class="flex justify-between text-xs text-gray-500"><span>${min}</span><span>${max}</span></div>`;
  }

  load('data/leetcode.json').then(d => {
    $('lc').innerHTML = `<div class="text-4xl text-white font-semibold">${d.total}<span class="text-sm text-gray-500"> solved</span></div>
      <div class="mt-3">${row('Easy', d.easy)}${row('Medium', d.medium)}${row('Hard', d.hard)}
      ${row('Global rank', d.ranking?.toLocaleString())}${row('Contest rating', d.contest_rating)}</div>`;
    $('synced').textContent = d.updated_at ?? '--';
  }).catch(() => $('lc').textContent = 'no data yet');

  load('data/htb.json').then(d => {
    $('htb').innerHTML = `${row('Rank', d.rank)}${row('Points', d.points)}${row('User owns', d.user_owns)}${row('System owns', d.system_owns)}
      <a href="${d.profile_url}" target="_blank" rel="noopener" class="inline-block mt-3 text-term hover:underline">view profile &rarr;</a>`;
  }).catch(() => $('htb').textContent = 'no data yet');

  load('data/dsa_tracker.json').then(d => {
    const s = d.summary || {};
    $('a2z-sum').textContent = s.striver_solved ? `[${s.striver_solved}${s.striver_total ? '/' + s.striver_total : ''}]` : '';
    $('topics').innerHTML = d.topics.map(t => {
      const pct = t.total ? Math.min(100, Math.round(100 * t.solved / t.total)) : null;
      return `<div><div class="flex justify-between"><span>${t.name}</span><span class="text-white">${t.solved}${t.total ? '/' + t.total : ''}</span></div>
        <div class="h-1.5 bg-edge rounded mt-1"><div class="h-1.5 bg-term rounded" style="width:${pct ?? (t.solved ? 100 : 0)}%"></div></div></div>`;
    }).join('');
    $('spark').innerHTML = spark((d.history || []).map(h => h.leetcode).filter(v => v != null));
  }).catch(() => $('topics').textContent = 'no data yet');
</script>
</body>
</html>
