name: Update stats

on:
  schedule:
    - cron: "0 2 * * *"      # daily, 02:00 UTC
  workflow_dispatch:          # "Run workflow" button
  push:
    paths: ["config.json", "docs/data/dsa_tracker.json"]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch stats
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          python scripts/fetch_leetcode.py
          python scripts/fetch_htb.py

      - name: Update tracker + README
        run: |
          python scripts/update_dsa_tracker.py
          python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: update stats"
          git pull --rebase
          git push
